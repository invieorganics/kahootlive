<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"> 
<meta name="theme-color" content="#2563eb"> 
<title>Kahoot Lobby — KahootLive</title> 
<!-- Include QRCode.js library for static QR generation --> 
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script> 
<style> 
*{box-sizing:border-box} 
html,body{margin:0;padding:0;width:100%;min-height:100%} 
body{min-height:100vh;display:flex;flex-direction:column;background:#f8fafc;font-family:Roboto,Arial,sans-serif;color:#1e293b} 
.lobby-wrapper{flex:1;display:flex;flex-direction:column;padding:24px 16px;max-width:800px;width:100%;margin:0 auto} 
.lobby-header{text-align:center;margin-bottom:20px} 
.lobby-header h1{margin:0 0 6px;font-size:24px;font-weight:800;color:#2563eb} 
.lobby-header p{margin:0;color:#64748b;font-size:14px;font-weight:600} 
.lobby-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px} 
@media(max-width:650px){.lobby-grid{grid-template-columns:1fr}} 
.lobby-card{background:#ffffff;border-radius:20px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.06);border:1px solid #e2e8f0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center} 

/* PIN Display Card */ 
.pin-display-box{width:100%;background:#eff6ff;border:2px dashed #3b82f6;border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px} 
.pin-title{font-size:14px;font-weight:700;color:#1e40af;text-transform:uppercase;letter-spacing:1px} 
.pin-number{font-size:42px;font-weight:900;color:#1d4ed8;letter-spacing:2px} 

/* QR Code Box */ 
.qr-container{background:#fff;padding:12px;border-radius:12px;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:center;margin-bottom:12px} 
.qr-instruction{font-size:13px;font-weight:600;color:#64748b;line-height:1.4} 
.qr-url-text{margin-top:8px;font-size:12px;font-weight:700;color:#2563eb;word-break:break-all;background:#eff6ff;padding:6px 10px;border-radius:8px;border:1px solid #bfdbfe;width:100%}

/* Players List Section */ 
.players-section{background:#ffffff;border-radius:20px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.06);border:1px solid #e2e8f0;display:flex;flex-direction:column;flex:1;min-height:220px;margin-bottom:24px} 
.players-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;border-bottom:2px solid #f1f5f9;padding-bottom:10px} 
.players-title{font-size:16px;font-weight:800;color:#0f172a} 
.players-count-badge{background:#e0e7ff;color:#3730a3;padding:4px 12px;border-radius:20px;font-size:14px;font-weight:800} 
.players-grid{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;max-height:250px;overflow-y:auto;padding:4px} 
.player-chip{background:#f1f5f9;color:#334155;padding:8px 16px;border-radius:20px;font-size:14px;font-weight:700;border:1px solid #cbd5e1;animation:fadeIn .3s ease} 

/* Open Game Players Window Button */ 
.open-players-btn{width:100%;border:0;border-radius:14px;padding:14px;background:#4f46e5;color:#fff;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(79,70,229,0.25);text-align:center;margin-bottom:14px;transition:transform 0.1s} 
.open-players-btn:active{transform:scale(.98)} 

.start-game-btn{width:100%;border:0;border-radius:14px;padding:16px;background:#16a34a;color:#fff;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,0.3);text-align:center;transition:transform 0.1s} 
.start-game-btn:active{transform:scale(.98)} 

.status-message{display:none;padding:14px;border-radius:12px;font-size:14px;font-weight:700;text-align:center;margin-bottom:16px} 
.status-message.error{display:block;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5} 
.status-message.info{display:block;background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe} 

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}} 
</style> 
</head> 
<body> 

<main class="lobby-wrapper"> 
<div class="lobby-header"> 
<h1 id="header-quiz-name">Game Lobby</h1> 
<p id="header-grade-name">Waiting for players to join...</p> 
</div> 

<div id="status-box" class="status-message"></div> 

<div class="lobby-grid"> 
<!-- Left Box: Game PIN Display --> 
<div class="lobby-card"> 
<div class="pin-display-box"> 
<span class="pin-title">Join at student login</span> 
<span id="pin-value" class="pin-number">------</span> 
</div> 
</div> 

<!-- Right Box: Static QR Code and URL --> 
<div class="lobby-card"> 
<div id="qrcode" class="qr-container"></div> 
<span class="qr-instruction">Scan QR code or open link below to join:</span> 
<div id="qr-url-display" class="qr-url-text">Loading URL...</div>
</div> 
</div> 

<!-- Players Connected Section (Realtime Live View on Lobby) --> 
<div class="players-section"> 
<div class="players-header"> 
<span class="players-title">Joined Players</span> 
<span id="player-count" class="players-count-badge">0</span> 
</div> 
<div id="players-container" class="players-grid"> 
<span style="color:#94a3b8;font-size:14px;font-weight:600;padding:10px;">Waiting for players to join...</span> 
</div> 
</div> 

<!-- Open Active Game Players Window Button --> 
<button type="button" id="open-players-win-btn" class="open-players-btn">📋 Open Full Leaderboard / Players Window</button>

<button type="button" id="start-game-btn" class="start-game-btn">🎮 Start Game Now</button> 
</main> 

<script type="module"> 
import { 
    initAppCore, 
    requireTeacher, 
    db, 
    doc, 
    onSnapshot 
} from "../shared/app-core.js";

try { 
    await initAppCore();
    requireTeacher(); 

    const statusBox = document.getElementById("status-box"); 
    const headerQuizName = document.getElementById("header-quiz-name"); 
    const headerGradeName = document.getElementById("header-grade-name"); 
    const pinValueEl = document.getElementById("pin-value"); 
    const playerCountEl = document.getElementById("player-count"); 
    const playersContainer = document.getElementById("players-container"); 
    const openPlayersWinBtn = document.getElementById("open-players-win-btn");
    const startGameBtn = document.getElementById("start-game-btn"); 
    const qrUrlDisplayEl = document.getElementById("qr-url-display");

    function showStatus(message, type = "info") { 
        statusBox.textContent = message; 
        statusBox.className = `status-message ${type}`; 
    } 

    const urlParams = new URLSearchParams(window.location.search); 
    const filePin = urlParams.get("pin") || ""; 
    const fileName = urlParams.get("name") || ""; 
    const gradeName = urlParams.get("gradename") || ""; 

    if (filePin) { 
        pinValueEl.textContent = filePin; 
    } 
    if (fileName) { 
        headerQuizName.textContent = fileName; 
    } 
    if (gradeName) { 
        headerGradeName.textContent = `Grade: ${gradeName} — Waiting Room`; 
    } 

    // Generate Static QR code pointing to student-login.html using current host URL 
    const studentLoginUrl = `${window.location.origin}/student/student-login.html`; 
    qrUrlDisplayEl.textContent = studentLoginUrl;

    new QRCode(document.getElementById("qrcode"), { 
        text: studentLoginUrl, 
        width: 140, 
        height: 140, 
        colorDark: "#0f172a", 
        colorLight: "#ffffff", 
        correctLevel: QRCode.CorrectLevel.H 
    }); 

    if (!filePin) { 
        showStatus("Missing game PIN in URL parameters.", "error"); 
    } else { 
        // Real-time listener for game session and players collection/array if stored inside session or subcollection 
        onSnapshot(doc(db, "game_sessions", filePin), (docSnap) => { 
            if (docSnap.exists()) { 
                const data = docSnap.data(); 
                // Render joined players if stored as an array or map inside session document 
                const players = data.players || []; 
                
                playerCountEl.textContent = Array.isArray(players) ? players.length : Object.keys(players).length; 
                
                let playerListArray = Array.isArray(players) ? players : Object.values(players); 
                
                if (playerListArray.length > 0) { 
                    playersContainer.innerHTML = ""; 
                    playerListArray.forEach(player => { 
                        const chip = document.createElement("div"); 
                        chip.className = "player-chip"; 
                        chip.textContent = typeof player === 'string' ? player : (player.name || player.username || "Player"); 
                        playersContainer.appendChild(chip); 
                    }); 
                } else { 
                    playersContainer.innerHTML = '<span style="color:#94a3b8;font-size:14px;font-weight:600;padding:10px;">Waiting for players to join...</span>'; 
                } 
            } 
        }); 
    } 

    // Open game-players.html in a new window/tab passing the current PIN
    openPlayersWinBtn.addEventListener("click", () => {
        if (!filePin) {
            alert("Game PIN is missing.");
            return;
        }
        window.open(`game-players.html?pin=${encodeURIComponent(filePin)}`, "_blank", "width=850,height=700");
    });

    startGameBtn.addEventListener("click", () => { 
        if (!filePin) return; 
        // Trigger game start or redirect to teacher game question controller page 
        window.location.href = `teacher-kahoot-play.html?pin=${encodeURIComponent(filePin)}&name=${encodeURIComponent(fileName)}&gradename=${encodeURIComponent(gradeName)}`; 
    }); 

} catch (e) { 
    console.error(e); 
    const statusBox = document.getElementById("status-box");
    if (statusBox) {
        statusBox.textContent = `Initialization error: ${e.message}`;
        statusBox.className = "status-message error";
    }
} 
</script> 
</body> 
</html>
