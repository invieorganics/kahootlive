
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<title>Teacher Dashboard — KahootLive</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%}
body{min-height:100vh;display:flex;flex-direction:column;background:#f5f7fb;font-family:Roboto,Arial,sans-serif;color:#111827}
.dashboard-wrapper{flex:1;display:flex;flex-direction:column;padding:30px 20px;max-width:1100px;width:100%;margin:0 auto}
.dashboard-header{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:16px}
.welcome-box h1{margin:0 0 4px;font-size:24px;font-weight:700}
.welcome-box p{margin:0;color:#6b7280;font-size:14px}
.logout-btn{border:0;border-radius:10px;padding:10px 18px;background:#ef4444;color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.logout-btn:active{transform:scale(.98)}
.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:24px}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.card h3{margin:0 0 10px;font-size:18px;font-weight:700}
.card p{margin:0 0 16px;color:#6b7280;font-size:14px;line-height:1.4}
.card-btn{display:inline-block;border:0;border-radius:10px;padding:10px 16px;background:#4f46e5;color:#fff;text-decoration:none;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.card-btn:active{transform:scale(.98)}
@media(max-width:600px){.dashboard-wrapper{padding:15px}.dashboard-header{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>

<main class="dashboard-wrapper">
<section class="dashboard-header">
<div class="welcome-box">
<h1 id="teacher-welcome">Welcome, Teacher</h1>
<p id="teacher-email">Loading account info...</p>
</div>
<button type="button" id="logout-btn" class="logout-btn">Sign Out</button>
</section>

<div class="dashboard-grid">
<div class="card">
<h3>Manage Quizzes</h3>
<p>Create, edit, and organize quizzes for your classroom sessions.</p>
<a href="quiz-manager.html" class="card-btn">Open Quizzes</a>
</div>
<div class="card">
<h3>Live Games</h3>
<p>Launch live game sessions and monitor student participation and scores.</p>
<a href="live-host.html" class="card-btn">Host Game</a>
</div>
</div>
</main>

<script type="module">
import { 
    initAppCore, 
    requireTeacher, 
    getCurrentUser, 
    logoutUser 
} from "../shared/app-core.js";

// Initialize App Core (handles header and footer injection automatically)
await initAppCore();

// Enforce teacher access role using App Core rules
requireTeacher();

// Populate teacher profile info from the single source of truth session
const teacher = getCurrentUser();
if (teacher) {
    document.getElementById("teacher-welcome").textContent = `Welcome, ${teacher.name || teacher.username || "Teacher"}!`;
    document.getElementById("teacher-email").textContent = teacher.email || "Educator Account";
}

document.getElementById("logout-btn").addEventListener("click", async () => {
    try {
        logoutUser();
    } catch (error) {
        console.error("Logout error: " + error.message);
    }
});
</script>
</body>
</html>
