<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>Student Leaderboards — KahootLive</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%}
body{min-height:100vh;display:flex;flex-direction:column;background:#f8fafc;font-family:Roboto,Arial,sans-serif;color:#1e293b}

.leaderboard-wrapper{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;max-width:480px;width:100%;margin:0 auto;padding:24px 16px;gap:20px}

.leaderboard-header{text-align:center;margin-bottom:8px}
.leaderboard-header h1{margin:0 0 6px;font-size:26px;font-weight:800;color:#2563eb}
.leaderboard-header p{margin:0;color:#64748b;font-size:14px;font-weight:600}

.leaderboard-card{background:#ffffff;border-radius:20px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.06);border:1px solid #e2e8f0;width:100%;display:flex;flex-direction:column;gap:16px}

.action-btn{width:100%;border:0;border-radius:14px;padding:18px;background:#2563eb;color:#fff;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(37,99,235,0.25);text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform 0.1s,background-color 0.2s}
.action-btn:active{transform:scale(.98)}
.action-btn.secondary{background:#0ea5e9;box-shadow:0 4px 14px rgba(14,165,233,0.25)}
.action-btn:hover{filter:brightness(1.05)}

.back-link{text-align:center;margin-top:4px}
.back-link a{font-size:13px;font-weight:700;color:#64748b;text-decoration:none}
.back-link a:hover{text-decoration:underline;color:#2563eb}
</style>
</head>
<body>

<main class="leaderboard-wrapper">
<div class="leaderboard-header">
<h1>🏆 Student Leaderboards</h1>
<p>Choose an activity leaderboard to view rankings</p>
</div>

<div class="leaderboard-card">
<a href="student-kahoot-leaderboard.html" id="kahoot-lb-link" class="action-btn">
<span>🎮 Kahoot Game Leaderboard</span>
</a>

<a href="student-spelling-leaderboard.html" id="spelling-lb-link" class="action-btn secondary">
<span>✍️ Spelling Bee Leaderboard</span>
</a>

<div class="back-link">
<a href="student-login.html">← Back to Student Login</a>
</div>
</div>
</main>

<script type="module">
console.log("🔥 LEADERBOARD SCRIPT STARTING...");

try {
    const appCore = await import("../shared/app-core.js");
    const { initAppCore } = appCore;

    const coreResult = initAppCore();
    if (coreResult instanceof Promise) {
        await coreResult;
    }
    console.log("SUCCESS: app-core initialized successfully in leaderboard.");

    // Preserve URL parameters (pin, name, id) if present, so switching pages maintains state
    const urlParams = new URLSearchParams(window.location.search);
    const queryString = urlParams.toString();

    if (queryString) {
        const kahootLink = document.getElementById("kahoot-lb-link");
        const spellingLink = document.getElementById("spelling-lb-link");
        
        if (kahootLink) kahootLink.href = `student-kahoot-leaderboard.html?${queryString}`;
        if (spellingLink) spellingLink.href = `student-spelling-leaderboard.html?${queryString}`;
    }

} catch (e) {
    console.error("FATAL SCRIPT CRASH in Leaderboard Hub:", e.message);
}
</script>
</body>
</html>
