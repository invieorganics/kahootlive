<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>Kahoot Game Setup — KahootLive</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%}
body{min-height:100vh;display:flex;flex-direction:column;background:#f8fafc;font-family:Roboto,Arial,sans-serif;color:#1e293b}
.setup-wrapper{flex:1;display:flex;flex-direction:column;padding:24px 16px;max-width:600px;width:100%;margin:0 auto}
.setup-header{margin-bottom:24px;text-align:center}
.setup-header h1{margin:0 0 8px;font-size:28px;font-weight:900;color:#2563eb}
.setup-header p{margin:0;color:#64748b;font-size:16px;font-weight:600;line-height:1.4}

.setup-card{background:#ffffff;border-radius:20px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.06);border:1px solid #e2e8f0;display:flex;flex-direction:column;gap:20px;margin-bottom:24px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#f8fafc;border-radius:12px;border:1px solid #e2e8f0}
.info-label{font-size:15px;font-weight:800;color:#64748b}
.info-value{font-size:17px;font-weight:900;color:#0f172a}

.form-group{display:flex;flex-direction:column;gap:8px}
.form-group label{font-size:15px;font-weight:900;color:#334155}
.form-select{width:100%;padding:14px;border:2px solid #cbd5e1;border-radius:12px;font-size:17px;font-weight:800;font-family:inherit;color:#0f172a;background:#fff;outline:none;cursor:pointer;transition:border-color 0.2s}
.form-select:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,0.15)}

.action-btn{width:100%;border:0;border-radius:14px;padding:18px;background:#2563eb;color:#fff;font-family:inherit;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 4px 14px rgba(37,99,235,0.25);text-align:center;transition:transform 0.1s}
.action-btn:active{transform:scale(.98)}
.action-btn:disabled{opacity:.6;cursor:not-allowed;box-shadow:none}

.status-message{display:none;padding:16px 18px;border-radius:12px;font-size:16px;font-weight:800;line-height:1.4;text-align:center;margin-bottom:20px}
.status-message.error{display:block;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.status-message.success{display:block;background:#dcfce7;color:#166534;border:1px solid #86efac}
.status-message.info{display:block;background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}

#toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: #0f172a;
    color: #fff;
    padding: 14px 28px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 800;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
    opacity: 0;
    z-index: 999999;
    pointer-events: none;
    text-align: center;
}
#toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
}
</style>
</head>
<body>

<main class="setup-wrapper">
<div class="setup-header">
<h1>Kahoot Game Setup</h1>
<p>Configure your game session and initialize the lobby.</p>
</div>

<div id="status-box" class="status-message"></div>

<div class="setup-card">
<div class="info-row">
<span class="info-label">File Name</span>
<span id="display-name" class="info-value">Loading...</span>
</div>
<div class="info-row">
<span class="info-label">File PIN</span>
<span id="display-pin" class="info-value">Loading...</span>
</div>
<div class="info-row">
<span class="info-label">Grade Name</span>
<span id="display-grade" class="info-value">Loading...</span>
</div>
<div class="info-row">
<span class="info-label">Total Questions</span>
<span id="display-questions" class="info-value">Loading...</span>
</div>

<div class="form-group">
<label for="time-selector">Time Per Question</label>
<select id="time-selector" class="form-select">
<option value="5">5 Seconds</option>
<option value="10" selected>10 Seconds</option>
<option value="15">15 Seconds</option>
<option value="20">20 Seconds</option>
<option value="30">30 Seconds</option>
</select>
</div>

<div class="form-group">
<label for="timer-pause-selector">Timer Pause/Resume State</label>
<select id="timer-pause-selector" class="form-select">
<option value="false" selected>Running (Unpaused)</option>
<option value="true">Paused</option>
</select>
</div>

<div class="form-group">
<label for="mode-selector">Game Mode</label>
<select id="mode-selector" class="form-select" disabled>
<option value="lobby" selected>Lobby (Waiting Room)</option>
</select>
</div>

<button type="button" id="start-lobby-btn" class="action-btn">🚀 Open Lobby</button>
</div>
</main>

<div id="toast">Settings updated successfully</div>

<script type="module">
import { 
    initAppCore, 
    requireTeacher, 
    db, 
    collection, 
    getDocs, 
    query, 
    where, 
    doc, 
    getDoc, 
    setDoc, 
    onSnapshot 
} from "../shared/app-core.js";

try {
    await initAppCore();
    requireTeacher();

    const statusBox = document.getElementById("status-box");
    const displayNameEl = document.getElementById("display-name");
    const displayPinEl = document.getElementById("display-pin");
    const displayGradeEl = document.getElementById("display-grade");
    const displayQuestionsEl = document.getElementById("display-questions");
    const timeSelector = document.getElementById("time-selector");
    const timerPauseSelector = document.getElementById("timer-pause-selector");
    const startLobbyBtn = document.getElementById("start-lobby-btn");
    const toastEl = document.getElementById("toast");

    function showStatus(message, type = "info") {
        statusBox.textContent = message;
        statusBox.className = `status-message ${type}`;
    }

    function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("show");
        setTimeout(() => {
            toastEl.classList.remove("show");
        }, 2500);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const fileName = urlParams.get("name") || "";
    const filePin = urlParams.get("pin") || "";
    const gradeName = urlParams.get("gradename") || "";

    displayNameEl.textContent = fileName || "N/A";
    displayPinEl.textContent = filePin || "N/A";
    displayGradeEl.textContent = gradeName || "N/A";

    let fetchedQuestions = [];

    async function initGameSession() {
        if (!filePin) {
            showStatus("Missing file PIN in URL parameters.", "error");
            displayQuestionsEl.textContent = "0";
            startLobbyBtn.disabled = true;
            return;
        }

        showStatus("Initializing game session document & resetting student scores...", "info");
        try {
            // --- RESET ALL STUDENT SCORES TO ZERO ON SETUP OPEN ---
            const scoresCollectionRef = collection(db, "game_sessions", filePin, "scores");
            const existingScoresSnap = await getDocs(scoresCollectionRef);
            
            const scoreResetPromises = existingScoresSnap.docs.map(studentDoc => 
                setDoc(studentDoc.ref, {
                    base: 0,
                    fast: 0,
                    total: 0
                }, { merge: true })
            );
            await Promise.all(scoreResetPromises);

            const metaRef = collection(db, "quiz_metadata");
            const qQuery = query(metaRef, where("pin", "==", filePin));
            const querySnapshot = await getDocs(qQuery);

            let matchedQuizId = null;
            querySnapshot.forEach(docSnap => {
                matchedQuizId = docSnap.id;
            });

            if (!matchedQuizId) {
                const qQueryCode = query(metaRef, where("code", "==", filePin));
                const snapCode = await getDocs(qQueryCode);
                snapCode.forEach(docSnap => {
                    matchedQuizId = docSnap.id;
                });
            }

            if (matchedQuizId) {
                const questionsDoc = await getDoc(doc(db, "quiz_questions", matchedQuizId));
                if (questionsDoc.exists()) {
                    const qData = questionsDoc.data();
                    if (Array.isArray(qData.questions)) {
                        fetchedQuestions = qData.questions;
                    } else if (qData && typeof qData === "object") {
                        const foundArr = Object.values(qData).find(val => Array.isArray(val));
                        if (foundArr) fetchedQuestions = foundArr;
                    }
                }
            }

            displayQuestionsEl.textContent = fetchedQuestions.length;

            const sessionId = filePin; 
            const timePerQuestion = parseInt(timeSelector.value, 10) || 10;
            const timerpauce = timerPauseSelector.value === "true";

            const sessionData = {
                pin: filePin,
                name: fileName,
                gradeName: gradeName,
                questionCount: fetchedQuestions.length,
                questions: fetchedQuestions, 
                timePerQuestion: timePerQuestion,
                timerpauce: timerpauce,
                gameMode: "lobby",
                currentQuestionIndex: 0,
                updatedAt: new Date().toISOString()
            };

            await setDoc(doc(db, "game_sessions", sessionId), sessionData, { merge: true });
            showStatus("Game session initialized and all student scores reset to 0.", "success");

            onSnapshot(doc(db, "game_sessions", filePin), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.timePerQuestion && parseInt(timeSelector.value, 10) !== parseInt(data.timePerQuestion, 10)) {
                        timeSelector.value = data.timePerQuestion;
                    }
                    if (typeof data.timerpauce === "boolean" && (timerPauseSelector.value === "true") !== data.timerpauce) {
                        timerPauseSelector.value = String(data.timerpauce);
                    }
                }
            });

        } catch (err) {
            console.error(err);
            displayQuestionsEl.textContent = fetchedQuestions.length;
            showStatus("Loaded with default parameters, scores reset attempted.", "info");
        }
    }

    timeSelector.addEventListener("change", async () => {
        if (!filePin) return;
        const newTime = parseInt(timeSelector.value, 10) || 10;
        showToast(`Timer updated to ${newTime} seconds`);

        try {
            await setDoc(doc(db, "game_sessions", filePin), {
                timePerQuestion: newTime,
                updatedAt: new Date().toISOString()
            }, { merge: true });
        } catch (err) {
            console.error("Failed to update timer in Firestore:", err);
            showStatus("Failed to sync timer change to Firestore.", "error");
        }
    });

    timerPauseSelector.addEventListener("change", async () => {
        if (!filePin) return;
        const isPaused = timerPauseSelector.value === "true";
        showToast(isPaused ? "Timer paused" : "Timer resumed");

        try {
            await setDoc(doc(db, "game_sessions", filePin), {
                timerpauce: isPaused,
                updatedAt: new Date().toISOString()
            }, { merge: true });
        } catch (err) {
            console.error("Failed to update timer pause state in Firestore:", err);
            showStatus("Failed to sync timer pause state to Firestore.", "error");
        }
    });

    startLobbyBtn.addEventListener("click", () => {
        if (!filePin) {
            showStatus("Invalid PIN number.", "error");
            return;
        }
        window.location.href = `teacher-kahoot-lobby.html?pin=${encodeURIComponent(filePin)}&name=${encodeURIComponent(fileName)}&gradename=${encodeURIComponent(gradeName)}`;
    });

    initGameSession();

} catch (e) {
    const statusBox = document.getElementById("status-box");
    if (statusBox) {
        statusBox.textContent = `Initialization error: ${e.message}`;
        statusBox.className = "status-message error";
    }
}
</script>
</body>
</html>
