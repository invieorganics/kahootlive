
<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"> 
<meta name="theme-color" content="#2563eb"> 
<title>Kahoot Lobby — KahootLive</title> 
<!-- Include QRCode.js library for static QR generation --> 
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script> 
<style> 
*{box-sizing:border-box} 
html,body{margin:0;padding:0;width:100%;min-height:100%} 
body{min-height:100vh;display:flex;flex-direction:column;background:#f8fafc;font-family:Roboto,Arial,sans-serif;color:#1e293b} 
.lobby-wrapper{flex:1;display:flex;flex-direction:column;padding:24px 16px;max-width:800px;width:100%;margin:0 auto} 
.lobby-header{text-align:center;margin-bottom:16px} 
.lobby-header h1{margin:0 0 4px;font-size:22px;font-weight:800;color:#2563eb} 
.lobby-header p{margin:0;color:#64748b;font-size:13px;font-weight:600} 

/* Layout structure: PIN on top, Big QR code center below it */
.top-section{display:flex;flex-direction:column;gap:16px;margin-bottom:20px}
.lobby-card{background:#ffffff;border-radius:20px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.06);border:1px solid #e2e8f0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center} 

/* PIN Display Card */ 
.pin-display-box{width:100%;background:#eff6ff;border:2px dashed #3b82f6;border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px} 
.pin-title{font-size:13px;font-weight:700;color:#1e40af;text-transform:uppercase;letter-spacing:1px} 
.pin-number{font-size:38px;font-weight:900;color:#1d4ed8;letter-spacing:2px} 

/* QR Code Box & Responsive Scaling */ 
.qr-container{background:#fff;padding:12px;border-radius:12px;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:center;margin-bottom:10px} 
.qr-container canvas, .qr-container img{display:block;height:auto !important;max-width:100% !important}

/* Mobile default sizing */
.qr-container img, .qr-container canvas { width: 180px !important; height: 180px !important; }

/* Desktop larger sizing so students far away can scan it easily */
@media(min-width: 768px) {
    .qr-container img, .qr-container canvas { width: 280px !important; height: 280px !important; }
}

.qr-instruction{font-size:13px;font-weight:600;color:#64748b;line-height:1.4} 
.qr-url-text{margin-top:6px;font-size:11px;font-weight:700;color:#2563eb;word-break:break-all;background:#eff6ff;padding:6px 10px;border-radius:8px;border:1px solid #bfdbfe;width:100%;max-width:500px}

/* Players List Section - Half Size */ 
.players-section{background:#ffffff;border-radius:20px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.06);border:1px solid #e2e8f0;display:flex;flex-direction:column;min-height:140px;max-height:180px;margin-bottom:20px} 
.players-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:2px solid #f1f5f9;padding-bottom:8px} 
.players-title{font-size:15px;font-weight:800;color:#0f172a} 
.players-count-badge{background:#e0e7ff;color:#3730a3;padding:2px 10px;border-radius:20px;font-size:13px;font-weight:800} 
.players-grid{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;max-height:100px;overflow-y:auto;padding:2px} 
.player-chip{background:#f1f5f9;color:#334155;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:700;border:1px solid #cbd5e1;animation:fadeIn .3s ease} 

/* Action Buttons Container */
.action-buttons{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}

/* Open Game Players Window Button */ 
.open-players-btn{width:100%;border:0;border-radius:14px;padding:12px;background:#4f46e5;color:#fff;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(79,70,229,0.25);text-align:center;transition:transform 0.1s} 
.open-players-btn:active{transform:scale(.98)} 

.start-game-btn{width:100%;border:0;border-radius:14px;padding:14px;background:#16a34a;color:#fff;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,0.3);text-align:center;transition:transform 0.1s} 
.start-game-btn:active{transform:scale(.98)} 

.status-message{display:none;padding:12px;border-radius:12px;font-size:13px;font-weight:700;text-align:center;margin-bottom:14px} 
.status-message.error{display:block;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5} 
.status-message.info{display:block;background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe} 

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}} 
</style> 
</head> 
<body> 

<main class="lobby-wrapper"> 
<div class="lobby-header"> 
<h1 id="header-quiz-name">Game Lobby</h1> 
<p id="header-grade-name">Waiting for players to join...</p> 
</div> 

<div id="status-box" class="status-message"></div> 

<!-- Top Section: PIN first, then Big Centered QR Code -->
<div class="top-section">
    <!-- Game PIN Display Card --> 
    <div class="lobby-card"> 
        <div class="pin-display-box"> 
            <span class="pin-title">Join at student login</span> 
            <span id="pin-value" class="pin-number">------</span> 
        </div> 
    </div> 

    <!-- Static QR Code and URL Card (Centered & Big) --> 
    <div class="lobby-card"> 
        <div id="qrcode" class="qr-container"></div> 
        <span class="qr-instruction">Scan QR code or open link below to join:</span> 
        <div id="qr-url-display" class="qr-url-text">Loading URL...</div>
    </div> 
</div>

<!-- Players Connected Section (Half Size Compact View) --> 
<div class="players-section"> 
    <div class="players-header"> 
        <span class="players-title">Joined Players</span> 
        <span id="player-count" class="players-count-badge">0</span> 
    </div> 
    <div id="players-container" class="players-grid"> 
        <span style="color:#94a3b8;font-size:13px;font-weight:600;padding:6px;">Waiting for players to join...</span> 
    </div> 
</div> 

<!-- Action Buttons -->
<div class="action-buttons">
    <button type="button" id="open-players-win-btn" class="open-players-btn">📋 Open Full Leaderboard / Players Window</button>
    <button type="button" id="start-game-btn" class="start-game-btn">🎮 Start Game Now</button> 
</div>
</main> 

<script type="module"> 
import { 
    initAppCore, 
    requireTeacher, 
    db, 
    doc, 
    collection, 
    onSnapshot 
} from "../shared/app-core.js";

try { 
    await initAppCore();
    requireTeacher(); 

    const statusBox = document.getElementById("status-box"); 
    const headerQuizName = document.getElementById("header-quiz-name"); 
    const headerGradeName = document.getElementById("header-grade-name"); 
    const pinValueEl = document.getElementById("pin-value"); 
    const playerCountEl = document.getElementById("player-count"); 
    const playersContainer = document.getElementById("players-container"); 
    const openPlayersWinBtn = document.getElementById("open-players-win-btn");
    const startGameBtn = document.getElementById("start-game-btn"); 
    const qrUrlDisplayEl = document.getElementById("qr-url-display");

    function showStatus(message, type = "info") { 
        statusBox.textContent = message; 
        statusBox.className = `status-message ${type}`; 
    } 

    const urlParams = new URLSearchParams(window.location.search); 
    const filePin = urlParams.get("pin") || ""; 
    const fileName = urlParams.get("name") || ""; 
    const gradeName = urlParams.get("gradename") || ""; 

    if (filePin) { 
        pinValueEl.textContent = filePin; 
    } 
    if (fileName) { 
        headerQuizName.textContent = fileName; 
    } 
    if (gradeName) { 
        headerGradeName.textContent = `Grade: ${gradeName} — Waiting Room`; 
    } 

    const studentLoginUrl = `${window.location.origin}/public/student/student-login.html?pin=${encodeURIComponent(filePin)}`; 
    qrUrlDisplayEl.textContent = studentLoginUrl;

    const qrContainer = document.getElementById("qrcode");
    qrContainer.innerHTML = "";
    new QRCode(qrContainer, { 
        text: studentLoginUrl, 
        width: 280, 
        height: 280, 
        colorDark: "#0f172a", 
        colorLight: "#ffffff", 
        correctLevel: QRCode.CorrectLevel.H 
    }); 

    if (!filePin) { 
        showStatus("Missing game PIN in URL parameters.", "error"); 
    } else { 
        onSnapshot(doc(db, "game_sessions", filePin), (docSnap) => { 
            if (docSnap.exists()) { 
                const data = docSnap.data(); 
                if (data.fileName || data.quizTitle || data.name) {
                    headerQuizName.textContent = data.fileName || data.quizTitle || data.name;
                }
            } 
        }); 

        const scoresColRef = collection(db, "game_sessions", filePin, "scores");
        onSnapshot(scoresColRef, (snapshot) => {
            playerCountEl.textContent = snapshot.size;

            if (!snapshot.empty) {
                playersContainer.innerHTML = "";
                snapshot.forEach((docSnap) => {
                    const playerData = docSnap.data();
                    const playerName = playerData.name || "Unknown";

                    const chip = document.createElement("div");
                    chip.className = "player-chip";
                    chip.textContent = playerName;
                    playersContainer.appendChild(chip);
                });
            } else {
                playersContainer.innerHTML = '<span style="color:#94a3b8;font-size:13px;font-weight:600;padding:6px;">Waiting for players to join...</span>';
            }
        });
    } 

    openPlayersWinBtn.addEventListener("click", () => {
        if (!filePin) {
            alert("Game PIN is missing.");
            return;
        }
        window.open(`game-players.html?pin=${encodeURIComponent(filePin)}`, "_blank", "width=850,height=700");
    });

    startGameBtn.addEventListener("click", () => { 
        if (!filePin) return; 
        window.location.href = `teacher-kahoot-play.html?pin=${encodeURIComponent(filePin)}&name=${encodeURIComponent(fileName)}&gradename=${encodeURIComponent(gradeName)}`; 
    }); 

} catch (e) { 
    console.error(e); 
    const statusBox = document.getElementById("status-box");
    if (statusBox) {
        statusBox.textContent = `Initialization error: ${e.message}`;
        statusBox.className = "status-message error";
    }
} 
</script> 
</body> 
</html>
