<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Sign Up — KahootLive Teacher</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Roboto, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .signup-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .06);
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 420px;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #2563eb;
            text-align: center;
            font-size: 24px;
            font-weight: 800;
        }
        .form-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 13px;
            font-weight: 800;
            color: #475569;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            color: #0f172a;
            background: #fff;
            outline: none;
        }
        input:focus {
            border-color: #2563eb;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            transition: transform 0.1s;
            margin-top: 6px;
        }
        button:active {
            transform: scale(.98);
        }
        button:hover {
            background-color: #1d4ed8;
        }
        #message {
            margin-top: 16px;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            padding: 10px;
            border-radius: 10px;
            display: none;
        }
        #message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
        #message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }
        #message.info {
            display: block;
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <h2>Teacher Registration</h2>
        <form id="signupForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Create a password (min 6 chars)">
            </div>
            <button type="submit">Sign Up</button>
        </form>
        <div id="message"></div>
    </div>

    <script type="module">
        import { 
            initAppCore, 
            auth, 
            db, 
            createUserWithEmailAndPassword, 
            setDoc, 
            doc 
        } from "../shared/app-core.js";

        try {
            await initAppCore();

            const signupForm = document.getElementById('signupForm');
            const messageDiv = document.getElementById('message');

            function showMessage(text, type = "info") {
                messageDiv.textContent = text;
                messageDiv.className = type;
            }

            signupForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                showMessage("Creating account...", "info");

                try {
                    // 1. Create user in Firebase Authentication using shared auth instance
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    // 2. Create the teacher profile document in Firestore using shared db instance and Auth UID
                    await setDoc(doc(db, "teachers", user.uid), {
                        name: name,
                        email: email,
                        createdAt: new Date().toISOString()
                    });

                    showMessage("Account created successfully! Redirecting...", "success");
                    signupForm.reset();

                    setTimeout(() => {
                        window.location.href = "index.html"; 
                    }, 1500);

                } catch (error) {
                    console.error("Error signing up:", error);
                    showMessage(error.message, "error");
                }
            });

        } catch (e) {
            const messageDiv = document.getElementById('message');
            if (messageDiv) {
                messageDiv.textContent = `Initialization error: ${e.message}`;
                messageDiv.className = "error";
            }
        }
    </script>
</body>
</html>
