
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>Student Login & Reconnect — KahootLive</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%}
body{min-height:100vh;display:flex;flex-direction:column;background:#f8fafc;font-family:Roboto,Arial,sans-serif;color:#1e293b;-webkit-text-size-adjust:100%}
.login-wrapper{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px;max-width:480px;width:100%;margin:0 auto}

.login-header{text-align:center;margin-bottom:20px}
.login-header h1{margin:0 0 6px;font-size:24px;font-weight:800;color:#2563eb}
.login-header p{margin:0;color:#64748b;font-size:13px;font-weight:600;padding:0 10px;line-height:1.4}

.login-card{background:#ffffff;border-radius:20px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.06);border:1px solid #e2e8f0;width:100%;display:flex;flex-direction:column;gap:16px;overflow:visible}

.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:13px;font-weight:800;color:#334155}
.form-input{width:100%;padding:16px 14px;border:2px solid #cbd5e1;border-radius:14px;font-size:18px;font-weight:700;font-family:inherit;color:#0f172a;background:#fff;outline:none;transition:border-color 0.2s}
.form-input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,0.15)}
.form-input[readonly]{background:#f1f5f9;color:#64748b;cursor:not-allowed;font-size:16px}

/* Avatar Picker Styles */
.avatar-section{display:flex;flex-direction:column;gap:6px;position:relative}
.selected-avatar-preview{display:flex;align-items:center;gap:12px;background:#f8fafc;padding:10px 14px;border-radius:14px;border:2px solid #cbd5e1;cursor:pointer}
.selected-avatar-preview img{width:48px;height:48px;border-radius:50%;background:#e2e8f0;object-fit:cover;flex-shrink:0}
.selected-avatar-preview span{flex:1;font-size:15px;font-weight:700;color:#334155}
.selected-avatar-preview button{background:#e0e7ff;color:#3730a3;border:none;padding:8px 14px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;flex-shrink:0}

.avatar-grid-container{display:none;grid-template-columns:repeat(4,1fr);gap:10px;max-height:220px;overflow-y:auto;padding:12px;background:#f1f5f9;border-radius:14px;border:1px solid #cbd5e1;margin-top:4px;-webkit-overflow-scrolling:touch}
.avatar-grid-container.open{display:grid}
@media(min-width:400px){.avatar-grid-container{grid-template-columns:repeat(5,1fr)}}

.avatar-option{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid transparent;background:#fff;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:transform 0.1s,border-color 0.1s}
.avatar-option img{width:100%;height:100%;object-fit:cover}
.avatar-option:hover{transform:scale(1.08)}
.avatar-option.selected{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,0.3)}

.action-btn{width:100%;border:0;border-radius:16px;padding:18px;background:#2563eb;color:#fff;font-family:inherit;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(37,99,235,0.25);text-align:center;transition:transform 0.1s;margin-top:4px}
.action-btn:active{transform:scale(.98)}
.action-btn:disabled{opacity:0.6;cursor:not-allowed}

.status-message{display:none;padding:14px;border-radius:12px;font-size:14px;font-weight:700;text-align:center;margin-bottom:16px;width:100%}
.status-message.error{display:block;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.status-message.success{display:block;background:#dcfce7;color:#166534;border:1px solid #86efac}
.status-message.info{display:block;background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
</style>
</head>
<body>

<main class="login-wrapper">
<div class="login-header">
<h1 id="page-title">Student Login</h1>
<p id="page-subtitle">Choose your avatar, enter your name & Game PIN</p>
</div>

<div id="status-box" class="status-message"></div>

<div class="login-card">
<!-- Student ID Field (Hidden initially, shown read-only if returning) -->
<div class="form-group" id="student-id-group" style="display:none;">
<label for="student-id-display">Student ID (Registered)</label>
<input type="text" id="student-id-display" class="form-input" readonly>
</div>

<!-- Avatar Picker Field -->
<div class="avatar-section">
<label>Choose Fancy Avatar</label>
<div id="avatar-preview-box" class="selected-avatar-preview">
<img id="current-avatar-img" src="" alt="Avatar">
<span id="current-avatar-name">Select Avatar</span>
<button type="button" id="toggle-avatars-btn">Change</button>
</div>
<div id="avatar-grid" class="avatar-grid-container"></div>
</div>

<!-- Nickname Field -->
<div class="form-group">
<label for="student-name">Your Nickname</label>
<input type="text" id="student-name" class="form-input" placeholder="Enter your name" autocomplete="off" autocapitalize="words">
</div>

<!-- Game PIN Field -->
<div class="form-group">
<label for="game-pin">Game PIN</label>
<input type="tel" id="game-pin" class="form-input" placeholder="e.g. 606053" autocomplete="off" pattern="[0-9]*">
</div>

<button type="button" id="join-btn" class="action-btn">🚀 Enter Lobby</button>
</div>
</main>

<script type="module">
import { 
    initAppCore, 
    db, 
    doc, 
    getDoc, 
    updateDoc, 
    setDoc, 
    arrayUnion 
} from "../shared/app-core.js";

try {
    const coreReturn = initAppCore();
    if (coreReturn instanceof Promise) {
        await coreReturn;
    }

    document.body.childNodes.forEach(node => {
        if (node.nodeType === Node.TEXT_NODE && node.textContent.trim().includes("[object Promise]")) {
            node.remove();
        }
    });

    const firstChild = document.body.firstChild;
    if (firstChild && firstChild.nodeType === Node.TEXT_NODE) {
        firstChild.textContent = firstChild.textContent.replace("[object Promise]", "").trim();
    }

    const avatarSeeds = [
        "Felix", "Aneka", "Zoe", "Milo", "Luna", "Oliver", "Maya", "Leo", "Sophie", "Lucas",
        "Aria", "Mason", "Chloe", "Ethan", "Nora", "Caleb", "Lily", "Ezra", "Hazel", "Jack",
        "Aurora", "Logan", "Stella", "asher", "Violet", "Lincoln", "Penelope", "Mateo", "Clara", "Hudson",
        "Bella", "ryan", "Ellie", "nathan", "Lucy", "samuel", "Hannah", "gabriel", "Savannah", "isaac"
    ];

    const avatarsList = avatarSeeds.map((seed, index) => {
        const styles = ["bottts", "adventurer", "avataaars", "fun-emoji"];
        const style = styles[index % styles.length];
        return {
            id: `avatar_${index + 1}`,
            name: `Avatar ${index + 1}`,
            url: `https://api.dicebear.com/7.x/${style}/svg?seed=${encodeURIComponent(seed)}`
        };
    });

    const gamePinInput = document.getElementById("game-pin");
    const studentNameInput = document.getElementById("student-name");
    const studentIdGroup = document.getElementById("student-id-group");
    const studentIdDisplay = document.getElementById("student-id-display");
    const pageTitle = document.getElementById("page-title");
    const pageSubtitle = document.getElementById("page-subtitle");
    const joinBtn = document.getElementById("join-btn");
    const statusBox = document.getElementById("status-box");
    const currentAvatarImg = document.getElementById("current-avatar-img");
    const currentAvatarName = document.getElementById("current-avatar-name");
    const toggleAvatarsBtn = document.getElementById("toggle-avatars-btn");
    const avatarGrid = document.getElementById("avatar-grid");
    const avatarPreviewBox = document.getElementById("avatar-preview-box");

    let selectedAvatarUrl = avatarsList[0].url;
    currentAvatarImg.src = selectedAvatarUrl;
    currentAvatarName.textContent = avatarsList[0].name;

    let existingStudentId = localStorage.getItem("kahootlive_remembered_student_id");
    const savedNickname = localStorage.getItem("kahootlive_remembered_nickname");

    if (savedNickname) {
        studentNameInput.value = savedNickname;
    }

    if (existingStudentId) {
        studentIdGroup.style.display = "flex";
        studentIdDisplay.value = existingStudentId;
        pageTitle.textContent = "Welcome Back!";
        pageSubtitle.textContent = `ID: ${existingStudentId} • Enter PIN to reconnect`;
        joinBtn.textContent = "🚀 Re-enter Session";
    }

    currentAvatarImg.addEventListener('error', () => {
        currentAvatarImg.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 24 24" fill="%232563eb"><circle cx="12" cy="12" r="10" fill="%23e0e7ff"/><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
    });

    avatarsList.forEach((av, idx) => {
        const option = document.createElement("div");
        option.className = `avatar-option ${idx === 0 ? 'selected' : ''}`;
        
        const img = document.createElement("img");
        img.src = av.url;
        img.alt = av.name;
        img.loading = "lazy";
        
        img.addEventListener('error', () => {
            img.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="%232563eb"><circle cx="12" cy="12" r="10" fill="%23e0e7ff"/><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
        });

        option.appendChild(img);

        option.addEventListener("click", () => {
            document.querySelectorAll(".avatar-option").forEach(el => el.classList.remove("selected"));
            option.classList.add("selected");
            selectedAvatarUrl = av.url;
            currentAvatarImg.src = selectedAvatarUrl;
            currentAvatarName.textContent = av.name;
            avatarGrid.classList.remove("open");
        });
        avatarGrid.appendChild(option);
    });

    toggleAvatarsBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        avatarGrid.classList.toggle("open");
    });

    avatarPreviewBox.addEventListener("click", () => {
        avatarGrid.classList.toggle("open");
    });

    function showStatus(message, type = "info") {
        statusBox.textContent = message;
        statusBox.className = `status-message ${type}`;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const urlPin = urlParams.get("pin");
    if (urlPin) {
        gamePinInput.value = urlPin;
    }

    joinBtn.addEventListener("click", async () => {
        const pin = gamePinInput.value.trim();
        const nickname = studentNameInput.value.trim();

        if (!pin || !nickname) {
            showStatus("Please enter both Game PIN and your Nickname.", "error");
            return;
        }

        joinBtn.disabled = true;
        showStatus("Connecting to game session...", "info");

        try {
            localStorage.setItem("kahootlive_remembered_nickname", nickname);

            const sessionRef = doc(db, "game_sessions", pin);
            const sessionSnap = await getDoc(sessionRef);

            if (!sessionSnap.exists()) {
                showStatus("Game session not found. Check your PIN.", "error");
                joinBtn.disabled = false;
                return;
            }

            const sessionData = sessionSnap.data();
            if (!Array.isArray(sessionData.players)) {
                await updateDoc(sessionRef, { players: [] });
            }

            let studentId = existingStudentId;
            if (!studentId) {
                const randomNum = Math.floor(10000 + Math.random() * 90000);
                studentId = `STU-${randomNum}`;
                localStorage.setItem("kahootlive_remembered_student_id", studentId);
            }

            const playersList = sessionData.players || [];
            const playerAlreadyListed = playersList.some(p => p.name === nickname);
            if (!playerAlreadyListed) {
                const playerPayload = {
                    name: nickname,
                    avatar: selectedAvatarUrl
                };
                await updateDoc(sessionRef, {
                    players: arrayUnion(playerPayload)
                });
            }

            const studentDocRef = doc(db, "game_sessions", pin, "scores", studentId);
            const studentDocSnap = await getDoc(studentDocRef);

            if (!studentDocSnap.exists()) {
                await setDoc(studentDocRef, {
                    studentId: studentId,
                    name: nickname,
                    avatar: selectedAvatarUrl,
                    base: 0,
                    fast: 0,
                    total: 0,
                    rank: 0,
                    joinedAt: new Date().toISOString()
                }, { merge: true });
            } else {
                await updateDoc(studentDocRef, {
                    name: nickname,
                    avatar: selectedAvatarUrl
                });
            }

            const studentSession = {
                studentId: studentId,
                name: nickname,
                avatar: selectedAvatarUrl,
                pin: pin,
                role: "student"
            };
            localStorage.setItem("kahootlive_student", JSON.stringify(studentSession));

            showStatus("Successfully connected! Redirecting...", "success");

            setTimeout(() => {
                window.location.href = `student-kahoot-lobby.html?pin=${encodeURIComponent(pin)}&name=${encodeURIComponent(nickname)}&id=${encodeURIComponent(studentId)}`;
            }, 800);

        } catch (error) {
            showStatus(`Failed to connect: ${error?.message || 'Unknown error'}`, "error");
            joinBtn.disabled = false;
        }
    });

} catch (e) {
    console.error("Critical Initialization error:", e);
}
</script>
</body>
</html>
